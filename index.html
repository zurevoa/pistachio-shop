<!DOCTYPE html>

<html lang="fa" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه پسته اعلاء</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0b0b0b; color: #e0e0e0; margin: 0; padding: 15px; direction: rtl; padding-bottom: 90px; }
        header { text-align: center; background: #1a1a1a; border: 1px solid #d4af37; color: #d4af37; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .menu-item { display: flex; background: #141414; border: 1px solid #222; padding: 14px; border-radius: 10px; margin-bottom: 10px; justify-content: space-between; align-items: center; }
        .add-btn { background: #d4af37; color: #000; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; border-top: 2px solid #d4af37; color: #d4af37; text-align: center; padding: 15px; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: #151515; border: 1px solid #d4af37; padding: 20px; border-radius: 12px; width: 320px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>🥜 فروشگاه مرکزی پسته</h1>
        <p>خرید آنلاین و مستقیم پسته اعلاء</p>
    </header>

    <div class="menu-item">
        <div><h3>پسته اکبری اعلاء (یک کیلو)</h3><p style="color:#d4af37; margin:0;">۶۵۰,۰۰۰ تومان</p></div>
        <button class="add-btn" onclick="addToCart('پسته اکبری (یک کیلو)', 650000)">+ افزودن</button>
    </div>
    <div class="menu-item">
        <div><h3>پسته سفید (یک کیلو)</h3><p style="color:#d4af37; margin:0;">۵۸۰,۰۰۰ تومان</p></div>
        <button class="add-btn" onclick="addToCart('پسته سفید (یک کیلو)', 580000)">+ افزودن</button>
    </div>

    <div class="cart-bar" onclick="openModal()">
        🛒 ثبت سفارش (<span id="count">1</span>) | مجموع: <span id="total">580,000</span> تومان
    </div>

    <div id="modal" class="modal" style="display: flex;">
        <div class="modal-box">
            <h3 style="color:#d4af37;">پرداخت و نهایی کردن</h3>
            <p style="font-size:12px; color:#aaa;">به کارت بانک ملی واریز کنید: 6037 - 9915 - 2723 - 3088</p>
            <input type="text" id="ref-id" placeholder="شماره پیگیری فیش واریزی" style="width:100%; padding:10px; background:#000; border:1px solid #444; color:#fff; margin-bottom:15px; box-sizing:border-box; text-align:center;">
            <button onclick="submitOrder()" style="background:#d4af37; color:#000; border:none; padding:10px 20px; font-weight:bold; border-radius:6px; cursor:pointer;">ارسال سفارش به پنل مغازه</button>
            <br><button onclick="closeModal()" style="background:transparent; color:#ff5555; border:none; margin-top:10px; cursor:pointer;">انصراف</button>
        </div>
    </div>

    <script>
        let cart = [], total = 0;

        function addToCart(name, price) {
            cart.push(name); total += price;
            document.getElementById('count').textContent = cart.length;
            document.getElementById('total').textContent = total.toLocaleString();
        }

        function openModal() {
            if (cart.length === 0) { alert('سبد خرید خالی است!'); return; }
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function submitOrder() {
            const ref = document.getElementById('ref-id').value;
            if (!ref) { alert('لطفاً شماره پیگیری را وارد کنید.'); return; }

            const order = {
                id: Math.floor(1000 + Math.random() * 9000),
                items: cart,
                total: total,
                paymentRef: ref,
                status: 'unread',
                time: new Date().toLocaleTimeString('fa-IR')
            };
            
            // اصلاح شده: ذخیره مستقیم با کلید مشترک seller_inbox تا پنل فروشنده بخواند
            let orders = JSON.parse(localStorage.getItem('seller_inbox') || '[]');
            orders.push(order);
            localStorage.setItem('seller_inbox', JSON.stringify(orders));

            alert('✅ سفارش شما ثبت و به پنل فروشنده ارسال شد!');
            cart = []; total = 0;
            document.getElementById('count').textContent = '0';
            document.getElementById('total').textContent = '0';
            document.getElementById('ref-id').value = '';
            closeModal();
        }
    </script>

</body></html>
